<!-- остальной HTML НЕ ТРОГАЛСЯ -->

<datalist id="food-library"></datalist>

<script>

/* весь твой код полностью без изменений */

/* ======================= JSON ДОБАВЛЕНО ======================= */

function exportJSON() {
  try {
    const dataStr = JSON.stringify(db, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = "diet_backup.json";
    a.click();

    URL.revokeObjectURL(url);
  } catch (e) {
    alert("Ошибка экспорта JSON");
    console.error(e);
  }
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    try {
      const imported = JSON.parse(e.target.result);

      if (!imported.days || !imported.library) {
        alert("Неверный формат файла");
        return;
      }

      if (!confirm("Заменить текущие данные импортированными?")) return;

      db = imported;
      save();

      alert("Данные успешно импортированы");
    } catch (err) {
      alert("Ошибка чтения JSON");
      console.error(err);
    }
  };

  reader.readAsText(file);
}

</script>
