<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контроль Веса и Питания v2.1 (Recovery)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal.active { display: flex; }
        input[type="number"]::-webkit-inner-spin-button { display: none; }
        .tab-active { border-bottom: 3px solid #4f46e5; color: #4f46e5; }
    </style>
</head>

<body class="bg-slate-50 min-h-screen pb-10">

<nav class="bg-indigo-700 text-white p-4 shadow-xl sticky top-0 z-40">
    <div class="container mx-auto flex justify-between items-center">
        <h1 class="font-bold text-lg">Мой Дневник</h1>
        <div class="flex gap-2">
            <button onclick="openAnalytics()" class="bg-indigo-900 px-3 py-1.5 rounded-lg text-xs font-semibold uppercase">Аналитика</button>
            <button onclick="exportToExcel()" class="bg-emerald-600 px-3 py-1.5 rounded-lg text-xs font-semibold uppercase">Excel</button>
            <button onclick="exportJSON()" class="bg-blue-600 px-3 py-1.5 rounded-lg text-xs font-semibold uppercase">JSON</button>
<button onclick="importJSON()" class="bg-orange-600 px-3 py-1.5 rounded-lg text-xs font-semibold uppercase">Импорт</button>
        </div>
    </div>
</nav>

<div class="container mx-auto p-4">

    <div id="recoveryAlert" class="hidden mb-4 p-3 bg-green-100 border border-green-200 text-green-700 rounded-xl text-sm font-medium">
        ✅ Данные из предыдущей версии успешно восстановлены!
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-md mb-6 border border-slate-200">
        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Выбрать дату</label>
        <div class="flex gap-2">
            <input type="date" id="newDateInput"
                   class="flex-1 border-slate-200 border-2 p-2.5 rounded-xl focus:ring-2 focus:ring-indigo-500">
            <button onclick="addDay()"
                    class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold">
                Добавить
            </button>
        </div>
    </div>

    <div class="overflow-x-auto bg-white rounded-2xl shadow-xl border border-slate-200">
        <table class="w-full border-collapse">
            <thead>
            <!-- 1-я строка: даты (colspan=2 на каждый день) -->
            <tr id="tableHeaderDates" class="bg-slate-50 border-b border-slate-200">
                <th class="p-4 border-r border-slate-200 text-slate-400 font-bold uppercase text-[10px]">
                    Параметры
                </th>
            </tr>
            <!-- 2-я строка: подзаголовки У/В -->
            <tr id="tableHeaderSub" class="bg-slate-50 border-b border-slate-200">
                <th class="p-2 border-r border-slate-200 text-slate-400 font-bold uppercase text-[10px]">
                </th>
            </tr>
            </thead>
            <tbody id="tableBody">
            <tr id="rowWeight">
                <td class="p-4 font-bold bg-slate-50 border-r border-slate-200 text-sm">Вес (У / В)</td>
            </tr>
            <tr id="rowFood">
                <td class="p-4 font-bold bg-slate-50 border-r border-slate-200 text-sm">Еда (ккал)</td>
            </tr>
            </tbody>
        </table>
    </div>
</div><div id="foodModal" class="modal items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl">
        <div class="p-6 border-b flex justify-between bg-slate-50">
            <h2 id="modalTitle" class="text-xl font-black">Питание</h2>
            <button onclick="closeModal()" class="text-3xl">&times;</button>
        </div>
        <div id="foodItemsContainer" class="p-6 overflow-y-auto space-y-4 flex-1"></div>
        <div class="p-6 border-t bg-slate-50 space-y-4">
            <button onclick="addFoodRow()" class="w-full border-2 border-dashed py-3 rounded-2xl font-bold">
                + Добавить строку
            </button>
            <div class="flex justify-between">
                <span class="text-xs font-bold uppercase">Итог:</span>
                <span class="text-2xl font-black text-indigo-600">
                    <span id="modalTotalKcal">0</span> ккал
                </span>
            </div>
            <button onclick="saveFood()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold">
                Сохранить
            </button>
        </div>
    </div>
</div>

<!-- Модалка аналитики -->
<div id="analyticsModal" class="modal items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-3xl w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl">
        <div class="p-6 border-b flex justify-between bg-slate-50">
            <h2 class="text-xl font-black">Аналитика</h2>
            <button onclick="closeAnalytics()" class="text-3xl">&times;</button>
        </div>
        <div class="p-6 overflow-y-auto flex-1">
            <canvas id="analyticsChart" height="120"></canvas>
        </div>
    </div>
</div>

<datalist id="food-library"></datalist>

<script>
/* =======================
   ФИКС РАБОТЫ С ДАТАМИ
   ======================= */

function parseDMY(dmy) {
    const [dd, mm, yyyy] = dmy.split('.').map(Number);
    return new Date(yyyy, mm - 1, dd); // ЛОКАЛЬНО
}

function parseYMD(ymd) {
    const [yyyy, mm, dd] = ymd.split('-').map(Number);
    return new Date(yyyy, mm - 1, dd); // ЛОКАЛЬНО
}

function formatDMYFromYMD(ymd) {
    const d = parseYMD(ymd);
    return `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
}

/* =======================
   ХРАНИЛИЩЕ
   ======================= */

const FINAL_DB_KEY = 'health_tracker_final_storage';
const OLD_KEYS = ['diet_db', 'weight_tracker_db'];

let db = { days: {}, library: {} };
let activeDate = null;

const calorieLibrary = {
    "курица":170,"грудка":113,"котлета":250,"рис":130,"говядина":250,
    "масло":717,"брокколи":34,"яйцо":155,"хлеб":250,"гречка":132,
    "рыба":150,"творог":100,"огурец":15,"помидор":18,"сыр":350
};

/* =======================
   1) БИБЛИОТЕКА БЛЮД: АВТО-СОРТИРОВКА ПО АЛФАВИТУ
   ======================= */

function normalizeFoodName(s) {
    return String(s || '').trim();
}

function sortLibraryInDb() {
    const entries = Object.entries(db.library || {});
    entries.sort((a, b) => a[0].localeCompare(b[0], 'ru', { sensitivity: 'base' }));
    db.library = Object.fromEntries(entries);
}

function rebuildFoodDatalist() {
    const dl = document.getElementById('food-library');
    if (!dl) return;
    const names = Object.keys(db.library || {})
        .sort((a, b) => a.localeCompare(b, 'ru', { sensitivity: 'base' }));
    dl.innerHTML = names.map(n => `<option value="${n}"></option>`).join('');
}

function migrateData() {
    let migrated = false;
    const current = localStorage.getItem(FINAL_DB_KEY);
    if (current) db = JSON.parse(current);

    OLD_KEYS.forEach(k => {
        const old = localStorage.getItem(k);
        if (old) {
            const p = JSON.parse(old);
            db.days = { ...(p.days||{}), ...db.days };
            db.library = { ...(p.library||{}), ...db.library };
            localStorage.removeItem(k);
            migrated = true;
        }
    });

    sortLibraryInDb();
    rebuildFoodDatalist();

    if (migrated) {
        localStorage.setItem(FINAL_DB_KEY, JSON.stringify(db));
        document.getElementById('recoveryAlert').classList.remove('hidden');
    }
}

function save() {
    sortLibraryInDb();
    localStorage.setItem(FINAL_DB_KEY, JSON.stringify(db));
    rebuildFoodDatalist();
    renderTable();
}

function addDay() {
    const val = document.getElementById('newDateInput').value;
    if (!val) return;
    const dmy = formatDMYFromYMD(val);
    if (!db.days[dmy]) {
        db.days[dmy] = { morning:'', evening:'', food:[] };
        save();
    }
}

/* =======================
   УДАЛЕНИЕ ДАТЫ
   ======================= */

function deleteDay(d) {
    if (!db.days[d]) return;
    if (!confirm(`Удалить дату ${d}?`)) return;
    delete db.days[d];
    save();
}

/* =======================
   2) ТАБЛИЦА: 2 КОЛОНКИ НА ДЕНЬ (У/В)
   + ВИЗУАЛЬНЫЕ ГРАНИЦЫ КОЛОНОК И МЕЖДУ СТРОКАМИ
   ======================= */

function updateWeight(d, field, val) {
    if (!db.days[d]) return;
    db.days[d][field] = val;
    sortLibraryInDb();
    localStorage.setItem(FINAL_DB_KEY, JSON.stringify(db));
}

function renderTable() {
    const headerDates = document.getElementById('tableHeaderDates');
    const headerSub = document.getElementById('tableHeaderSub');
    const rowW = document.getElementById('rowWeight');
    const rowF = document.getElementById('rowFood');

    headerDates.innerHTML = `<th class="p-4 border-r text-xs uppercase border-slate-200">Параметры</th>`;
    headerSub.innerHTML = `<th class="p-2 border-r text-xs uppercase border-slate-200"></th>`;

    rowW.innerHTML = `<td class="p-4 font-bold bg-slate-50 border-r border-slate-200">Вес</td>`;
    /* Граница между строками Вес и Еда — верхняя граница у всей строки Еда */
    rowF.innerHTML = `<td class="p-4 font-bold bg-slate-50 border-r border-slate-200 border-t-2 border-slate-200">Еда</td>`;

    const dates = Object.keys(db.days).sort((a,b)=>parseDMY(b)-parseDMY(a));

    dates.forEach((d, idx)=>{
        // Разделитель между датами: делаем заметную границу слева у каждого дня, кроме первого
        const daySep = idx === 0 ? '' : 'border-l-2 border-slate-200';

        headerDates.innerHTML += `
            <th class="p-4 text-center" colspan="2">
                <div class="flex items-center justify-center gap-2 ${daySep}">
                    <span>${d}</span>
                    <button
                        class="w-6 h-6 rounded-lg border border-slate-200 text-slate-500 hover:bg-slate-100"
                        title="Удалить дату"
                        onclick="deleteDay('${d}')">
                        &times;
                    </button>
                </div>
            </th>
        `;

        headerSub.innerHTML += `
            <th class="p-2 text-center text-[10px] font-bold uppercase text-slate-500 ${daySep}">У</th>
            <th class="p-2 text-center text-[10px] font-bold uppercase text-slate-500">В</th>
        `;

        // ВЕС — делаем инпуты явно видимыми (рамка, фон, паддинг)
        rowW.innerHTML += `
            <td class="p-2 ${daySep}">
                <input value="${db.days[d].morning}"
                       class="w-full text-center border-2 border-slate-200 bg-white rounded-lg p-2 focus:ring-2 focus:ring-indigo-500"
                       oninput="updateWeight('${d}','morning',this.value)">
            </td>
            <td class="p-2">
                <input value="${db.days[d].evening}"
                       class="w-full text-center border-2 border-slate-200 bg-white rounded-lg p-2 focus:ring-2 focus:ring-indigo-500"
                       oninput="updateWeight('${d}','evening',this.value)">
            </td>
        `;

        // ЕДА — плюс верхняя граница (между строками), и разделитель дня слева
        const kcal = (db.days[d].food || []).reduce((s,i)=>s+(+i.kcal||0),0);
        rowF.innerHTML += `
            <td class="text-center cursor-pointer select-none hover:bg-slate-50 transition p-2 border-t-2 border-slate-200 ${daySep}"
                colspan="2"
                onclick="openFoodModal('${d}')"
                title="Нажмите, чтобы ввести еду">
                ${Math.round(kcal)}
            </td>
        `;
    });
}

/* =======================
   ВВОД ЕДЫ: КЛИК ПО ЯЧЕЙКЕ ЕДА
   ======================= */

function openFoodModal(d) {
    if (!db.days[d]) return;
    activeDate = d;

    document.getElementById('modalTitle').textContent = `Питание — ${d}`;
    document.getElementById('foodModal').classList.add('active');

    if (!Array.isArray(db.days[d].food)) db.days[d].food = [];

    renderFoodRows(db.days[d].food);

    if (db.days[d].food.length === 0) addFoodRow();

    recalcModalTotal();
}

function closeModal() {
    const m = document.getElementById('foodModal');
    if (m) m.classList.remove('active');
    activeDate = null;
}

function renderFoodRows(items) {
    const c = document.getElementById('foodItemsContainer');
    c.innerHTML = '';
    items.forEach(item => addFoodRow(item));
}

function getKnownKcalByName(name) {
    const n = normalizeFoodName(name).toLowerCase();
    if (!n) return null;

    if (db.library && Object.prototype.hasOwnProperty.call(db.library, n)) {
        const v = parseFloat(db.library[n]);
        return Number.isFinite(v) ? v : null;
    }
    if (Object.prototype.hasOwnProperty.call(calorieLibrary, n)) {
        const v = parseFloat(calorieLibrary[n]);
        return Number.isFinite(v) ? v : null;
    }
    return null;
}

function addFoodRow(prefill) {
    const c = document.getElementById('foodItemsContainer');
    const row = document.createElement('div');
    row.className = "flex gap-2 items-center";

    const nameVal = prefill && prefill.name ? String(prefill.name) : '';
    const kcalVal = prefill && (prefill.kcal !== undefined && prefill.kcal !== null) ? String(prefill.kcal) : '';

    row.innerHTML = `
        <div class="flex-1">
            <input class="w-full border-2 border-slate-200 p-2.5 rounded-xl focus:ring-2 focus:ring-indigo-500"
                   placeholder="Блюдо"
                   list="food-library"
                   value="${nameVal}">
        </div>
        <div class="w-32">
            <input type="number"
                   class="w-full border-2 border-slate-200 p-2.5 rounded-xl text-center focus:ring-2 focus:ring-indigo-500"
                   placeholder="ккал"
                   value="${kcalVal}">
        </div>
        <button class="w-10 h-10 rounded-xl border-2 border-slate-200 hover:bg-slate-50 text-slate-500 font-black"
                title="Удалить строку">&times;</button>
    `;

    const nameInput = row.children[0].querySelector('input');
    const kcalInput = row.children[1].querySelector('input');
    const delBtn = row.children[2];

    function onAnyChange() {
        recalcModalTotal();
    }

    nameInput.addEventListener('input', () => {
        const known = getKnownKcalByName(nameInput.value);
        if ((kcalInput.value === '' || kcalInput.value === null) && known !== null) {
            kcalInput.value = String(known);
        }
        onAnyChange();
    });

    kcalInput.addEventListener('input', onAnyChange);

    delBtn.addEventListener('click', () => {
        row.remove();
        recalcModalTotal();
    });

    c.appendChild(row);
    recalcModalTotal();
}

function recalcModalTotal() {
    const c = document.getElementById('foodItemsContainer');
    const rows = Array.from(c.children);

    let total = 0;
    rows.forEach(r => {
        const kcalInput = r.querySelectorAll('input')[1];
        const v = parseFloat(String(kcalInput.value || '').replace(',', '.'));
        if (Number.isFinite(v)) total += v;
    });

    document.getElementById('modalTotalKcal').textContent = Math.round(total);
}

function saveFood() {
    if (!activeDate || !db.days[activeDate]) return;

    const c = document.getElementById('foodItemsContainer');
    const rows = Array.from(c.children);

    const food = [];
    rows.forEach(r => {
        const inputs = r.querySelectorAll('input');
        const name = normalizeFoodName(inputs[0].value);
        const kcalRaw = String(inputs[1].value || '').replace(',', '.');
        const kcal = parseFloat(kcalRaw);

        if (!name && !Number.isFinite(kcal)) return;

        const item = {
            name: name,
            kcal: Number.isFinite(kcal) ? kcal : ''
        };
        food.push(item);

        const key = normalizeFoodName(name).toLowerCase();
        if (key && Number.isFinite(kcal)) {
            db.library[key] = kcal;
        }
    });

    db.days[activeDate].food = food;

    save();
    closeModal();
}

/* =======================
   3) АНАЛИТИКА: НЕ УСРЕДНЯТЬ, КАЖДЫЙ ЗАМЕР ОТДЕЛЬНО,
      ЕСЛИ НЕТ ЗАМЕРА — ПРОПУСК (null), А НЕ 0
   ======================= */

let analyticsChart = null;

function toNumberOrNull(v) {
    const n = parseFloat(String(v || '').replace(',', '.'));
    return Number.isFinite(n) ? n : null;
}

function openAnalytics() {
    const modal = document.getElementById('analyticsModal');
    modal.classList.add('active');

    const datesAsc = Object.keys(db.days).sort((a,b)=>parseDMY(a)-parseDMY(b));

    const labels = [];
    const data = [];

    datesAsc.forEach(d => {
        labels.push(`${d} (У)`);
        data.push(toNumberOrNull(db.days[d].morning));

        labels.push(`${d} (В)`);
        data.push(toNumberOrNull(db.days[d].evening));
    });

    const ctx = document.getElementById('analyticsChart').getContext('2d');
    if (analyticsChart) analyticsChart.destroy();

    analyticsChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels,
            datasets: [{
                label: 'Вес',
                data,
                spanGaps: false,
                tension: 0.25
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: true } },
            scales: {
                y: { beginAtZero: false }
            }
        }
    });
}

function closeAnalytics() {
    document.getElementById('analyticsModal').classList.remove('active');
}

function exportToExcel() {
    const data = Object.keys(db.days).map(d=>({
        Дата:d,
        ВесУ:db.days[d].morning,
        ВесВ:db.days[d].evening,
        Ккал:(db.days[d].food || []).reduce((s,i)=>s+(+i.kcal||0),0)
    }));
    const ws = XLSX.utils.json_to_sheet(data);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Дневник");
    XLSX.writeFile(wb, "Diet_Data.xlsx");
}

function init() {
    migrateData();
    document.getElementById('newDateInput').value =
        new Date().toISOString().slice(0,10);
    renderTable();
}

init();
</script>
</body>
</html>
