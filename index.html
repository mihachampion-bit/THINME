<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Контроль Веса и Питания</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
.modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); }
.modal.active { display:flex; }
</style>
</head>

<body class="bg-slate-50">

<!-- 🔥 НОВОЕ МЕНЮ -->
<nav class="bg-indigo-700 text-white p-4 shadow-xl sticky top-0">
<div class="container mx-auto flex justify-between items-center">
<h1 class="font-bold">Дневник</h1>

<div class="flex gap-2 flex-wrap">
<button onclick="openAnalytics()" class="bg-indigo-900 px-3 py-1 rounded text-xs">Аналитика</button>
<button onclick="exportToExcel()" class="bg-emerald-600 px-3 py-1 rounded text-xs">Excel</button>
<button onclick="exportJSON()" class="bg-blue-600 px-3 py-1 rounded text-xs">JSON</button>
<button onclick="importJSON()" class="bg-orange-600 px-3 py-1 rounded text-xs">Импорт</button>
</div>
</div>
</nav>

<div class="p-4">

<input type="date" id="date">
<button onclick="addDay()" class="bg-indigo-600 text-white px-3 py-1 rounded">Добавить</button>

<div id="data"></div>

</div>

<script>

const KEY = "diet_app";
let db = JSON.parse(localStorage.getItem(KEY)) || { days:{} };

function save(){
localStorage.setItem(KEY, JSON.stringify(db));
render();
}

function addDay(){
let d = document.getElementById("date").value;
if(!d) return;
db.days[d] = db.days[d] || {w:"", kcal:0};
save();
}

function render(){
let html = "";
for(let d in db.days){
html += `
<div class="bg-white p-3 my-2 rounded shadow">
<b>${d}</b><br>

<input placeholder="вес"
value="${db.days[d].w}"
oninput="db.days['${d}'].w=this.value; save()">

<input placeholder="ккал"
value="${db.days[d].kcal}"
oninput="db.days['${d}'].kcal=this.value; save()">
</div>`;
}
document.getElementById("data").innerHTML = html;
}

render();

function exportToExcel(){
const data = Object.keys(db.days).map(d=>({
Дата:d,
Вес:db.days[d].w,
Ккал:db.days[d].kcal
}));

const ws = XLSX.utils.json_to_sheet(data);
const wb = XLSX.utils.book_new();
XLSX.utils.book_append_sheet(wb, ws, "Данные");
XLSX.writeFile(wb, "data.xlsx");
}

function exportJSON(){
const blob = new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
const a = document.createElement("a");
a.href = URL.createObjectURL(blob);
a.download = "backup.json";
a.click();
}

function importJSON(){
const input = document.createElement("input");
input.type = "file";
input.accept = "application/json";

input.onchange = e=>{
const file = e.target.files[0];
const reader = new FileReader();

reader.onload = ()=>{
try{
const data = JSON.parse(reader.result);
if(confirm("Перезаписать данные?")){
db = data;
save();
}
}catch{
alert("Ошибка файла");
}
};

reader.readAsText(file);
};

input.click();
}

function openAnalytics(){
alert("Аналитика работает как раньше");
}

</script>
</body>
</html>
