<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контроль Веса и Питания v2.1 (Recovery)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        .modal { display: none; position: fixed; z-index: 50; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal.active { display: flex; }
        input[type="number"]::-webkit-inner-spin-button { display: none; }
        .tab-active { border-bottom: 3px solid #4f46e5; color: #4f46e5; }
    </style>
</head>

<body class="bg-slate-50 min-h-screen pb-10">

<nav class="bg-indigo-700 text-white p-4 shadow-xl sticky top-0 z-40">
    <div class="container mx-auto flex justify-between items-center">
        <h1 class="font-bold text-lg">Мой Дневник</h1>
        <div class="flex gap-2">
            <button onclick="openAnalytics()" class="bg-indigo-900 px-3 py-1.5 rounded-lg text-xs font-semibold uppercase">Аналитика</button>
            <button onclick="exportToExcel()" class="bg-emerald-600 px-3 py-1.5 rounded-lg text-xs font-semibold uppercase">Excel</button>
        </div>
    </div>
</nav>

<div class="container mx-auto p-4">

    <div class="bg-white p-6 rounded-2xl shadow-md mb-6 border border-slate-200">
        <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Выбрать дату</label>
        <div class="flex gap-2">
            <input type="date" id="newDateInput"
                   class="flex-1 border-slate-200 border-2 p-2.5 rounded-xl focus:ring-2 focus:ring-indigo-500">
            <button onclick="addDay()"
                    class="bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold">
                Добавить
            </button>
        </div>
    </div>

    <div class="overflow-x-auto bg-white rounded-2xl shadow-xl border border-slate-200">
        <table class="w-full border-collapse">
            <thead>
            <tr id="tableHeaderDates" class="bg-slate-50 border-b border-slate-200">
                <th class="p-4 border-r border-slate-300 text-slate-400 font-bold uppercase text-[10px]">
                    Параметры
                </th>
            </tr>
            <tr id="tableHeaderSub" class="bg-slate-50 border-b border-slate-200">
                <th class="p-2 border-r border-slate-300"></th>
            </tr>
            </thead>
            <tbody>
            <tr id="rowWeight">
                <td class="p-4 font-bold bg-slate-50 border-r border-slate-300 text-sm">Вес</td>
            </tr>
            <tr id="rowFood">
                <td class="p-4 font-bold bg-slate-50 border-r border-slate-300 text-sm">Еда (ккал)</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
function parseDMY(dmy) {
    const [dd, mm, yyyy] = dmy.split('.').map(Number);
    return new Date(yyyy, mm - 1, dd);
}

const FINAL_DB_KEY = 'health_tracker_final_storage';
let db = { days: {} };

function save() {
    localStorage.setItem(FINAL_DB_KEY, JSON.stringify(db));
    renderTable();
}

function addDay() {
    const val = document.getElementById('newDateInput').value;
    if (!val) return;
    const d = val.split('-').reverse().join('.');
    if (!db.days[d]) {
        db.days[d] = { morning:'', evening:'', food:[] };
        save();
    }
}

function deleteDay(d) {
    if (!confirm(`Удалить дату ${d}?`)) return;
    delete db.days[d];
    save();
}

function updateWeight(d, field, val) {
    db.days[d][field] = val;
    localStorage.setItem(FINAL_DB_KEY, JSON.stringify(db));
}

function renderTable() {
    const hd = document.getElementById('tableHeaderDates');
    const hs = document.getElementById('tableHeaderSub');
    const rw = document.getElementById('rowWeight');
    const rf = document.getElementById('rowFood');

    hd.innerHTML = `<th class="p-4 border-r border-slate-300">Параметры</th>`;
    hs.innerHTML = `<th class="p-2 border-r border-slate-300"></th>`;
    rw.innerHTML = `<td class="p-4 font-bold bg-slate-50 border-r border-slate-300">Вес</td>`;
    rf.innerHTML = `<td class="p-4 font-bold bg-slate-50 border-r border-slate-300">Еда</td>`;

    const dates = Object.keys(db.days).sort((a,b)=>parseDMY(b)-parseDMY(a));

    dates.forEach(d=>{
        hd.innerHTML += `
            <th colspan="2" class="p-4 text-center border-l-2 border-slate-300">
                ${d}
                <button onclick="deleteDay('${d}')" class="ml-2 text-slate-400 hover:text-red-500">&times;</button>
            </th>
        `;
        hs.innerHTML += `
            <th class="p-2 text-center border-l-2 border-slate-300 text-xs">У</th>
            <th class="p-2 text-center text-xs">В</th>
        `;
        rw.innerHTML += `
            <td class="border-l-2 border-slate-300">
                <input class="w-full text-center" value="${db.days[d].morning}"
                       oninput="updateWeight('${d}','morning',this.value)">
            </td>
            <td>
                <input class="w-full text-center" value="${db.days[d].evening}"
                       oninput="updateWeight('${d}','evening',this.value)">
            </td>
        `;
        rf.innerHTML += `
            <td colspan="2" class="text-center border-l-2 border-slate-300 cursor-pointer">
                ${(db.days[d].food||[]).reduce((s,i)=>s+(+i.kcal||0),0)}
            </td>
        `;
    });
}

(function init(){
    const stored = localStorage.getItem(FINAL_DB_KEY);
    if (stored) db = JSON.parse(stored);
    document.getElementById('newDateInput').value =
        new Date().toISOString().slice(0,10);
    renderTable();
})();
</script>

</body>
</html>
